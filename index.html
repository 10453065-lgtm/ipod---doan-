<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPod Touch 4G - Ultimate Doan Labs Edition</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1a202c 0%, #05070a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            perspective: 1500px;
            touch-action: none;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Escena 3D con amortiguación premium imitando las físicas de Doan Labs */
        .escena-3d {
            width: 290px;
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
            will-change: transform;
        }

        .device-container {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* CARA FRONTAL: Pantalla y marco de cristal */
        .cara-frente {
            width: 100%;
            height: 100%;
            position: absolute;
            background: #000;
            border-radius: 40px;
            border: 3px solid #1a1a1a;
            padding: 40px 13px;
            box-sizing: border-box;
            backface-visibility: hidden;
            z-index: 2;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
        }

        /* CARA TRASERA: Espejo cromado pulido del iPod Touch 4G */
        .cara-atras {
            width: 100%;
            height: 100%;
            position: absolute;
            background: linear-gradient(135deg, #ffffff 0%, #e1e1e1 20%, #a1a1a1 60%, #efefef 80%, #bcbcbc 100%);
            border-radius: 40px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .apple-logo {
            width: 45px;
            height: 55px;
            background-image: url('https://wikimedia.org');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.65;
            filter: drop-shadow(0 1px 1px white);
        }
        .ipod-text {
            color: #444;
            font-size: 24px;
            font-weight: 300;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .camara-trasera {
            position: absolute;
            top: 20px;
            left: 25px;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #09152a, #000);
            border-radius: 50%;
            border: 1px solid #777;
        }

        .camara-frontal {
            width: 6px;
            height: 6px;
            background-color: #111;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pantalla {
            width: 100%;
            height: 100%;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .status-bar {
            height: 20px;
            background: linear-gradient(to bottom, #444, #111);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            color: white;
            font-weight: bold;
        }

        .view {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            height: calc(100% - 20px);
            display: none;
            flex-direction: column;
        }
        .view.active { display: flex; }

        /* PANTALLA DE BLOQUEO */
        #lock-screen {
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .reloj { color: white; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .reloj h1 { font-size: 44px; margin: 0; font-weight: 300; }
        .reloj p { font-size: 14px; margin: 2px 0; }

        .slide-contenedor {
            width: 85%;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 2px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .bloque-deslizar {
            width: 46px;
            height: 100%;
            background: linear-gradient(to bottom, #fff, #bbb);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #222;
        }
        .texto-brillo { color: #ccc; font-size: 11px; margin-left: 10px; font-weight: bold; animation: brillo 2s infinite; }
        @keyframes brillo { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* TECLADO PIN */
        #pin-screen { background: rgba(0,0,0,0.88); align-items: center; justify-content: center; color: white; padding: 20px; box-sizing: border-box;}
        .pin-dots { display: flex; gap: 15px; margin: 15px 0; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; }
        .dot.filled { background-color: white; }
        .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 210px; }
        .tecla { height: 46px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }
        .tecla:active { background: rgba(255,255,255,0.3); }

        /* HOME SCREEN */
        #home-screen { background-color: #000; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; padding: 15px 8px; flex-grow: 1; }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-img { width: 44px; height: 44px; border-radius: 9px; background-size: cover; background-position: center; box-shadow: 0 3px 6px rgba(0,0,0,0.5); }
        .app-label { color: white; font-size: 9px; margin-top: 4px; text-align: center; }
        .dock { height: 65px; background: linear-gradient(to bottom, rgba(255,255,255,0.15), rgba(255,255,255,0.02)); border-top: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px; }

        /* AJUSTES APP */
        #settings-app { background-color: #efeff4; color: black; padding: 15px; box-sizing: border-box; }
        .settings-row { background: white; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 14px; }
        .settings-row input { width: 80px; padding: 4px; text-align: center; font-weight: bold; }
        .btn-back { background: #007aff; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        /* DISPOSITIVO BLOQUEADO */
        #disabled-screen { background: #000; color: #ff3b30; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box;}

        /* Botón físico de Home */
        .home-button {
            width: 40px;
            height: 40px;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 50%;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .home-square { width: 12px; height: 12px; border: 1.5px solid #666; border-radius: 3px; }

        /* Controles inferiores de Doan Labs */
        .doan-controls {
            width: 90%;
            background: rgba(20, 25, 35, 0.85);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .slider { flex-grow: 1; -webkit-appearance: none; height: 4px; background: #334155; border-radius: 2px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="escena-3d" id="device3D">
            <div class="device-container">
                
                <div class="cara-frente">
                    <div class="camara-frontal"></div>
                    <div class="pantalla">
